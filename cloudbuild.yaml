steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg=NODE_ENV=production'
      - '-t'
      - '${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'

  # Warn (never fail) when the Slack alert webhook secret has no enabled version.
  # Reads metadata only, never the value. Alerts stay off until the secret exists.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud secrets versions describe latest --secret=fde-slack-alert-webhook --project=$PROJECT_ID --format='value(state)' 2>/dev/null | grep -q ENABLED; then
          echo "WARNING: secret fde-slack-alert-webhook has no enabled version (or is unreadable from Cloud Build); Slack error alerts will not post."
        fi

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'
      - '--project=$PROJECT_ID'
      - '--region=${_CLOUD_RUN_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--concurrency=80'
      - '--memory=512Mi'
      - '--max-instances=${_MAX_INSTANCES}'
      # Runtime env for the service. '^@^' sets '@' as the list separator so values may contain commas.
      # --set-env-vars replaces the full env set, so this list is the complete live config.
      - '--set-env-vars=^@^MIXPANEL_TOKEN=${_MIXPANEL_TOKEN}@FRONTEND_URL=${_FRONTEND_URL}@REGION=${_REGION}@RUNTIME=prod@PLATFORM=cloud_run'
      # Slack error alerts (#fde) from Secret Manager. --set-env-vars above only replaces plain
      # env vars; this secret-backed var is managed separately and survives it.
      - '--update-secrets=SLACK_ALERT_WEBHOOK_URL=fde-slack-alert-webhook:latest'

# Substitution variables
substitutions:
  _SERVICE: 'express-proxy'
  _REPO: 'express-proxy-repo'
  _TAG: 'latest'
  _CLOUD_RUN_REGION: 'us-central1'
  _ARTIFACT_LOCATION: 'us-central1'
  # Defaults match the live service (express-proxy-00037), except max instances lowered 100 -> 20. Empty MIXPANEL_TOKEN = forced-token mode off.
  _MIXPANEL_TOKEN: ''
  _FRONTEND_URL: ''
  _REGION: 'US'
  _MAX_INSTANCES: '20'

# Container image will be stored in Artifact Registry
images:
  - '${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY