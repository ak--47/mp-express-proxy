steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg=NODE_ENV=production'
      - '-t'
      - '${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'
      - '--project=$PROJECT_ID'
      - '--region=${_CLOUD_RUN_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--concurrency=80'
      - '--memory=512Mi'
      - '--max-instances=${_MAX_INSTANCES}'
      # Runtime env for the service. '^@^' sets '@' as the list separator so values may contain commas.
      # --set-env-vars replaces the full env set, so this list is the complete live config.
      - '--set-env-vars=^@^MIXPANEL_TOKEN=${_MIXPANEL_TOKEN}@FRONTEND_URL=${_FRONTEND_URL}@REGION=${_REGION}@RUNTIME=prod@PLATFORM=cloud_run'

# Substitution variables
substitutions:
  _SERVICE: 'express-proxy'
  _REPO: 'express-proxy-repo'
  _TAG: 'latest'
  _CLOUD_RUN_REGION: 'us-central1'
  _ARTIFACT_LOCATION: 'us-central1'
  # Defaults match the live service (express-proxy-00037). Empty MIXPANEL_TOKEN = forced-token mode off.
  _MIXPANEL_TOKEN: ''
  _FRONTEND_URL: ''
  _REGION: 'US'
  _MAX_INSTANCES: '100'

# Container image will be stored in Artifact Registry
images:
  - '${_ARTIFACT_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY